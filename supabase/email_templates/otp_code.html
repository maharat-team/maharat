<!--
  Paste into BOTH Supabase templates (Authentication > Emails):
    - Magic Link     (returning users)
    - Confirm signup (first-time users)
  Suggested subject: Your Maharat code: {{ .Token }}
-->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1f2937;">
  <h2 style="margin: 0 0 8px; color: #065f46;">Maharat</h2>
  <p style="margin: 0 0 24px;">Enter this code in the app to sign in:</p>
  <p style="margin: 0 0 24px; font-size: 32px; font-weight: bold; letter-spacing: 8px; text-align: center;">{{ .Token }}</p>
  <p style="margin: 0 0 8px; font-size: 14px;">This code expires in 10 minutes.</p>
  <p style="margin: 0; font-size: 13px; color: #6b7280;">If you did not request it, you can ignore this email. Never share this code with anyone.</p>
</div>
